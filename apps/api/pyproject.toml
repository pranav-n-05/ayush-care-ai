[project]
name = "ayushcare-api"
version = "0.1.0"
description = "AyushCare AI backend: practitioner-reviewed, multilingual case-taking (portfolio project, synthetic data only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.4",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "sqlalchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "celery[redis]==5.7.0",
    "packaging==26.3",  # required at runtime by kombu's redis transport
    "redis==8.1.0",
    "structlog==26.1.0",
    "python-multipart==0.0.33",
    "email-validator==2.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "httpx==0.28.1",
    "ruff==0.17.4",
    "mypy==2.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "E501"]  # line length is owned by `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]
